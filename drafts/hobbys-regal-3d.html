<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hobbys: Regal 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap" rel="stylesheet" />
<style>
  /* Mockup D v3 (2026-10-09): Hobbys as a real-time 3D shelf (three.js), in the clay look of
     devanshuchauhan.in, reworked after a blunt critique: moulded shelf with filleted corners,
     a wide "Platz" bay (Fußball + Trainer), light cones instead of an orange wash, contact
     shadows, squash/anticipation/overshoot in the animations, quiet idle life, a centred and
     angled zoom, a 2-column shelf on phones. */
  :root {
    --bg: #ffcdb5;
    --paper: #ffffff;
    --ink: #0f1b2d;
    --ink-2: #434f5e;
    --line: rgb(15 27 45 / 0.17);
    --sans: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
    --serif: "Newsreader", Georgia, serif;
    --wrap: min(max(72rem, 84vw), 130rem);
    --gutter: clamp(1rem, 4vw, 3rem);
    --sp-gap: clamp(1.25rem, 3vw, 3rem);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font: 1.0625rem/1.5 var(--sans); color: var(--ink);
    background:
      radial-gradient(60rem 40rem at 80% 90%, rgb(255 170 120 / 0.35), transparent 70%),
      radial-gradient(50rem 30rem at 10% 10%, rgb(255 230 210 / 0.5), transparent 70%),
      var(--bg);
    min-height: 100vh;
  }
  .note-top { font-size: 0.875rem; color: var(--ink-2); padding: 0.75rem var(--gutter); border-bottom: 1px solid var(--line); background: rgb(255 255 255 / 0.4); }
  .wrap { width: min(var(--wrap), 100% - 2 * var(--gutter)); margin-inline: auto; }
  section { padding: clamp(3rem, 6vw, 6rem) 0; border-top: 1.5px solid var(--ink); }
  .head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1rem 2rem; margin-bottom: var(--sp-gap); }
  h2 { font-family: var(--serif); font-weight: 500; letter-spacing: -0.02em; font-size: clamp(2.75rem, 1.5rem + 4vw, 5rem); line-height: 1; }
  .switch { display: inline-flex; padding: 4px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--paper); }
  .switch button { padding: 0.45rem 1rem; border: 0; border-radius: 999px; background: transparent; font: 600 0.9375rem var(--sans); color: var(--ink-2); cursor: pointer; }
  .switch button[aria-checked="true"] { background: var(--ink); color: var(--paper); }
  .switch button:focus-visible, .row:focus-visible, .back:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .room { display: grid; gap: var(--sp-gap); align-items: center; }
  @media (min-width: 64rem) { .room { grid-template-columns: 8fr 4fr; } }

  .stage { position: relative; aspect-ratio: 16 / 10.5; touch-action: pan-y; }
  .stage canvas { display: block; width: 100%; height: 100%; opacity: 0; transition: opacity 0.6s; }
  .stage.is-ready canvas { opacity: 1; }
  .stage.is-hover { cursor: pointer; }
  .stage.is-focus { cursor: zoom-out; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-2); font-size: 0.9375rem; transition: opacity 0.4s; }
  .stage.is-ready .loading { opacity: 0; pointer-events: none; }

  .tag {
    position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none;
    padding: 0.2rem 0.75rem; border: 1.5px solid var(--ink); border-radius: 999px;
    background: var(--paper); font: 600 0.875rem var(--sans); white-space: nowrap;
    opacity: 0; transition: opacity 0.25s;
  }
  .tag.is-on { opacity: 1; }
  .back {
    position: absolute; left: 0.75rem; top: 0.75rem; z-index: 3;
    padding: 0.4rem 0.9rem; border: 1.5px solid var(--ink); border-radius: 999px;
    background: var(--paper); font: 600 0.875rem var(--sans); color: var(--ink); cursor: pointer;
    opacity: 0; translate: 0 -6px; pointer-events: none; visibility: hidden; transition: opacity 0.3s, translate 0.3s, visibility 0s 0.3s;
  }
  .stage.is-focus .back { opacity: 1; translate: 0 0; pointer-events: auto; visibility: visible; transition: opacity 0.3s, translate 0.3s; }

  .list { list-style: none; padding: 0; display: grid; gap: 0.25rem; }
  .row {
    display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: none; cursor: pointer;
    padding: 0.55rem 0 0.55rem 1rem; border: 0; border-left: 3px solid transparent; transition: opacity 0.25s, border-color 0.25s;
  }
  .row h3 { font: 600 1.25rem/1.2 var(--serif); }
  .row p { font-size: 0.9375rem; line-height: 1.45; color: var(--ink-2); margin-top: 0.15rem; }
  .row.is-on { border-left-color: var(--ink); }
  .list.has-on .row:not(.is-on) { opacity: 0.55; }

  @media (prefers-reduced-motion: reduce) {
    .stage canvas, .tag, .back, .row { transition: none; }
  }
</style>
<script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  } }
</script>
</head>
<body>
<p class="note-top">Mockup Hobbys D v3, „Regal 3D“: echte 3D-Szene (three.js), alles im Code modelliert. Auf ein Fach zeigen = Licht an, das Ding spielt. Klicken oder antippen = heranzoomen, Esc oder „Zurück“ = zurück. Schmales Fenster = Handy-Regal (2 Spalten).</p>

<section>
  <div class="wrap">
    <div class="head">
      <h2>Hobbys</h2>
      <div class="switch" role="radiogroup" aria-label="Welche Seite zeigen">
        <button type="button" role="radio" aria-checked="false" data-mode="out">Draußen</button>
        <button type="button" role="radio" aria-checked="true" data-mode="all">Beides</button>
        <button type="button" role="radio" aria-checked="false" data-mode="in">Drinnen</button>
      </div>
    </div>

    <div class="room">
      <div class="stage" data-stage>
        <p class="loading">Regal wird aufgebaut …</p>
        <button type="button" class="back" data-back>Zurück zum Regal</button>
      </div>
      <ul class="list" data-list>
        <li><button type="button" class="row" data-id="fussball"><h3>Fußball</h3><p>Ich spiele selbst.</p></button></li>
        <li><button type="button" class="row" data-id="trainer"><h3>Trainer</h3><p>Und ich stehe als Trainer an der Seitenlinie.</p></button></li>
        <li><button type="button" class="row" data-id="basketball"><h3>Basketball</h3><p>Neben Fußball der Sport, den ich am liebsten verfolge.</p></button></li>
        <li><button type="button" class="row" data-id="ausgehen"><h3>Ausgehen</h3><p>Freunde treffen, raus in die Stadt, gern auch spontan.</p></button></li>
        <li><button type="button" class="row" data-id="gaming"><h3>Gaming</h3><p>Zocken gehört für mich genauso dazu wie der Platz.</p></button></li>
        <li><button type="button" class="row" data-id="nerd"><h3>Ein bisschen Nerd</h3><p>Drucke Teile mit dem 3D-Drucker und automatisiere eigene Projekte mit Claude.</p></button></li>
      </ul>
    </div>
  </div>
</section>

<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const stage = document.querySelector("[data-stage]");
const listEl = document.querySelector("[data-list]");
const rows = [...listEl.querySelectorAll(".row")];
const backBtn = document.querySelector("[data-back]");

// ---------- renderer ----------
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
} catch (e) {
  stage.querySelector(".loading").textContent = "Dein Browser zeigt kein 3D. Die Liste daneben erzählt dasselbe.";
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 0.95;
stage.prepend(renderer.domElement);
renderer.domElement.setAttribute("aria-hidden", "true");

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.32;
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 80);

const HEMI = 0.95, KEY = 1.8;
const hemi = new THREE.HemisphereLight("#fff6ee", "#d8cfc6", HEMI);
scene.add(hemi);
const key = new THREE.DirectionalLight("#fff8f0", KEY);
key.position.set(-1.6, 3.4, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -2.4, right: 2.4, top: 2, bottom: -2, near: 2, far: 16 });
key.shadow.radius = 4;
key.shadow.bias = -0.0006;
key.shadow.normalBias = 0.01;
scene.add(key);

// ---------- clay ----------
const makeBump = (repeat) => {
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const x = c.getContext("2d");
  x.fillStyle = "#808080";
  x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 1400; i++) {
    const r = 2 + Math.random() * 9, px = Math.random() * 256, py = Math.random() * 256, v = Math.random() > 0.5 ? 255 : 0;
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, `rgba(${v},${v},${v},0.09)`);
    g.addColorStop(1, `rgba(${v},${v},${v},0)`);
    x.fillStyle = g;
    x.fillRect(px - r, py - r, r * 2, r * 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  return t;
};
const clayBump = makeBump(1), shelfBump = makeBump(3);
const clay = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, metalness: 0, bumpMap: clayBump, bumpScale: 0.35, ...o });
const INK = "#1b2638";
const ink = clay(INK);
const rbox = (w, h, d, r, mat) => new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, r), mat);
const box = (w, h, d, mat) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
const cyl = (rt, rb, h, mat, seg = 28) => new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
const sph = (r, mat) => new THREE.Mesh(new THREE.SphereGeometry(r, 36, 24), mat);
const at = (m, x, y, z) => (m.position.set(x, y, z), m);
const clamp01 = (v) => Math.min(Math.max(v, 0), 1);
const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
const backOut = (t) => 1 + 2.70158 * (t - 1) ** 3 + 1.70158 * (t - 1) ** 2;
const seg = (p, a, b) => ease(clamp01((p - a) / (b - a)));
const bump = (p, a, b) => (p > a && p < b ? Math.sin((Math.PI * (p - a)) / (b - a)) : 0);
const lathe = (pts, mat) => new THREE.Mesh(new THREE.LatheGeometry(pts.map(([x, y]) => new THREE.Vector2(x, y)), 48), mat);
const noShadow = (o) => (o.traverse((c) => (c.userData.noShadow = true)), o);
const canvasTex = (w, h) => {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return [c.getContext("2d"), t];
};
// a soft dark spot where something touches the floor
const blobTex = (() => {
  const [x, t] = canvasTex(128, 128);
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, "rgba(15,27,45,0.55)");
  g.addColorStop(0.5, "rgba(15,27,45,0.22)");
  g.addColorStop(1, "rgba(15,27,45,0)");
  x.fillStyle = g;
  x.fillRect(0, 0, 128, 128);
  t.needsUpdate = true;
  return t;
})();
const blob = (w, d, opacity = 1) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, opacity, depthWrite: false }));
  m.rotation.x = -Math.PI / 2;
  m.renderOrder = 1;
  return noShadow(m);
};
// a goal net: a square grid with transparent holes
const netTex = (() => {
  const [x, t] = canvasTex(64, 64);
  x.clearRect(0, 0, 64, 64);
  x.strokeStyle = "rgba(250,250,247,1)";
  x.lineWidth = 5;
  x.strokeRect(0, 0, 64, 64);
  t.needsUpdate = true;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
})();
const netMat = (rx, ry) => {
  const t = netTex.clone();
  t.needsUpdate = true;
  t.repeat.set(rx, ry);
  return new THREE.MeshStandardMaterial({ map: t, transparent: true, alphaTest: 0.35, side: THREE.DoubleSide, roughness: 0.9 });
};

// ---------- the shelf (rebuilt per layout) ----------
const T = 0.1, CW = 1, CH = 0.8, D = 0.74, R = 0.075;
const LAYOUTS = {
  wide: { cols: 3, rows: 2, at: { fussball: [0, 0], trainer: [1, 0], basketball: [2, 0], ausgehen: [0, 1], gaming: [1, 1], nerd: [2, 1] } },
  tall: { cols: 2, rows: 3, at: { fussball: [0, 0], trainer: [1, 0], basketball: [0, 1], ausgehen: [1, 1], gaming: [0, 2], nerd: [1, 2] } },
};
let L, W, H;
const cellX = (c) => -W / 2 + T + CW / 2 + c * (CW + T);
const floorY = (r) => H / 2 - T - CH - r * (CH + T);
const shelfMat = clay("#ece7e1", { bumpMap: shelfBump, bumpScale: 0.6 });
const backMat = clay("#e2dcd5", { bumpMap: shelfBump, bumpScale: 0.6 });
const fillet = (() => {
  const s = new THREE.Shape();
  s.moveTo(0, 0); s.lineTo(R, 0); s.absarc(R, R, R, -Math.PI / 2, Math.PI, true); s.lineTo(0, 0);
  return new THREE.ExtrudeGeometry(s, { depth: D - 0.06, bevelEnabled: false, curveSegments: 10 });
})();
let shelf = null;
function buildShelf() {
  if (shelf) scene.remove(shelf);
  shelf = new THREE.Group();
  shelf.add(at(box(W - 0.02, H - 0.02, 0.05, backMat), 0, 0, -D / 2 + 0.025));
  for (let r = 0; r <= L.rows; r++) shelf.add(at(rbox(W, T, D, 0.045, shelfMat), 0, H / 2 - T / 2 - r * (CH + T), 0));
  for (const x of [-W / 2 + T / 2, W / 2 - T / 2]) shelf.add(at(rbox(T, H, D, 0.045, shelfMat), x, 0, 0));
  // inner dividers per row; the top row's first two cells are one bay ("Platz")
  const cells = [];
  for (let r = 0; r < L.rows; r++) {
    for (let d = 1; d < L.cols; d++) {
      if (r === 0 && d === 1) continue;
      shelf.add(at(rbox(T, CH + 0.04, D, 0.04, shelfMat), -W / 2 + T / 2 + d * (CW + T), floorY(r) + CH / 2, 0));
    }
    if (r === 0) cells.push([cellX(0) - CW / 2, cellX(1) + CW / 2]);
    for (let c = r === 0 ? 2 : 0; c < L.cols; c++) cells.push([cellX(c) - CW / 2, cellX(c) + CW / 2]);
    for (const [x0, x1] of cells.splice(0)) {
      const y0 = floorY(r), y1 = y0 + CH;
      for (const [x, y, rot] of [[x0, y0, 0], [x1, y0, Math.PI / 2], [x1, y1, Math.PI], [x0, y1, -Math.PI / 2]]) {
        const f = at(new THREE.Mesh(fillet, shelfMat), x, y, -D / 2 + 0.05);
        f.rotation.z = rot;
        shelf.add(f);
      }
    }
  }
  for (const x of [-W / 2 + 0.3, W / 2 - 0.3]) shelf.add(at(rbox(0.14, 0.08, 0.32, 0.03, ink), x, -H / 2 - 0.04, 0));
  shelf.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(shelf);
}

// the light cone fades from the lamp to the floor
const coneFade = (() => {
  const [x, t] = canvasTex(4, 128);
  const gr = x.createLinearGradient(0, 0, 0, 128);
  gr.addColorStop(0, "rgba(255,255,255,1)");
  gr.addColorStop(1, "rgba(255,255,255,0.08)");
  x.fillStyle = gr; x.fillRect(0, 0, 4, 128);
  t.needsUpdate = true;
  return t;
})();

// ---------- compartments ----------
const items = [];
function slot(id, side, sc, dur, build) {
  const g = new THREE.Group();
  scene.add(g);
  const inner = new THREE.Group();
  inner.scale.setScalar(sc);
  inner.position.z = 0.05;
  g.add(inner);
  const api = build(inner, g, sc);
  // lamp: fixture, bulb, a soft visible cone and a warm point light
  g.add(at(cyl(0.07, 0.065, 0.022, ink), 0, CH - 0.011, 0.2));
  const bulbMat = clay("#fff1c9", { emissive: "#ffb000", emissiveIntensity: 0, bumpMap: null });
  g.add(at(sph(0.026, bulbMat), 0, CH - 0.034, 0.2));
  const coneMat = new THREE.MeshBasicMaterial({ color: "#ffd9a0", map: coneFade, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
  const cone = noShadow(at(new THREE.Mesh(new THREE.ConeGeometry(0.4, CH - 0.06, 40, 1, true), coneMat), 0, (CH - 0.06) / 2, 0.14));
  g.add(cone);
  const lamp = new THREE.PointLight("#ffd9a0", 0, 1.0, 1.6);
  scene.add(lamp);
  const hit = at(new THREE.Mesh(new THREE.BoxGeometry(CW, CH, D), new THREE.MeshBasicMaterial({ visible: false })), 0, CH / 2, 0);
  hit.userData.id = id;
  g.add(hit);
  const it = { id, side, g, inner, sc, api, dur, lamp, bulbMat, coneMat, hit, on: false, glow: 0, time: 0, running: false, label: rows.find((r) => r.dataset.id === id).querySelector("h3").textContent };
  api.rest();
  items.push(it);
}
function placeItems() {
  for (const it of items) {
    const [c, r] = L.at[it.id];
    it.g.position.set(cellX(c), floorY(r), 0);
    it.lamp.position.set(cellX(c), floorY(r) + CH - 0.1, 0.24);
    it.col = c;
  }
}

// 1 Fußball: one pitch across the "Platz" bay; the ball winds up, flies in, squashes on the net
slot("fussball", "out", 1.18, 2.8, (g, outer, sc) => {
  const white = clay("#f6f5f1");
  const MAT = 0.026;
  // the pitch spans the whole bay (this cell and the trainer's), in world units
  const pitch = new THREE.Group();
  pitch.scale.setScalar(1 / sc);
  pitch.position.set((CW + T) / 2 / sc, 0, -0.03 / sc);
  pitch.add(at(rbox(2 * CW + T - 0.08, MAT, 0.6, 0.012, clay("#3f9a5c")), 0, MAT / 2, 0));
  const lineM = clay("#ffffff", { bumpMap: null });
  pitch.add(at(box(0.006, 0.002, 0.56, lineM), 0, MAT + 0.001, 0));
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.11, 0.118, 56), lineM);
  ring.rotation.x = -Math.PI / 2;
  pitch.add(at(ring, 0, MAT + 0.001, 0));
  g.add(pitch);
  const m = MAT / sc;
  const goal = new THREE.Group();
  goal.position.set(0.1, m, -0.1);
  const bar = (len, x, y, z, rot) => { const b = at(cyl(0.015, 0.015, len, white, 16), x, y, z); if (rot === "z") b.rotation.z = Math.PI / 2; if (rot === "x") b.rotation.x = Math.PI / 2; goal.add(b); };
  bar(0.4, -0.26, 0.2, 0); bar(0.4, 0.26, 0.2, 0); bar(0.535, 0, 0.4, 0, "z");
  bar(0.2, -0.26, 0.4, -0.1, "x"); bar(0.2, 0.26, 0.4, -0.1, "x"); bar(0.52, 0, 0.012, -0.2, "z");
  bar(0.2, -0.26, 0.012, -0.1, "x"); bar(0.2, 0.26, 0.012, -0.1, "x"); bar(0.4, -0.26, 0.2, -0.2); bar(0.4, 0.26, 0.2, -0.2);
  const backGeo = new THREE.PlaneGeometry(0.52, 0.4, 18, 14);
  goal.add(noShadow(at(new THREE.Mesh(backGeo, netMat(13, 10)), 0, 0.2, -0.2)));
  for (const x of [-0.26, 0.26]) { const s = noShadow(at(new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.4), netMat(5, 10)), x, 0.2, -0.1)); s.rotation.y = Math.PI / 2; goal.add(s); }
  const top = noShadow(at(new THREE.Mesh(new THREE.PlaneGeometry(0.52, 0.2), netMat(13, 5)), 0, 0.4, -0.1));
  top.rotation.x = Math.PI / 2;
  goal.add(top);
  g.add(goal);
  const base = backGeo.attributes.position.array.slice();
  const bulge = (b) => {
    const p = backGeo.attributes.position;
    for (let i = 0; i < p.count; i++) p.setZ(i, -b * Math.exp(-(base[i * 3] ** 2 + (base[i * 3 + 1] + 0.06) ** 2) / 0.03));
    p.needsUpdate = true;
  };
  // corner flag, front right
  g.add(at(cyl(0.006, 0.006, 0.3, white, 8), -0.38, m + 0.15, 0.26));
  const flagGeo = new THREE.PlaneGeometry(0.13, 0.085, 10, 2);
  flagGeo.translate(-0.065, 0, 0);
  const flag = at(new THREE.Mesh(flagGeo, clay("#e8503a", { side: THREE.DoubleSide, bumpMap: null })), -0.38, m + 0.255, 0.26);
  flag.rotation.y = Math.PI;
  g.add(flag);
  const fbase = flagGeo.attributes.position.array.slice();
  const wave = (t, amp) => {
    const p = flagGeo.attributes.position;
    for (let i = 0; i < p.count; i++) { const x = fbase[i * 3]; p.setZ(i, Math.sin(x * 50 + t * 9) * amp * (-x / 0.13)); }
    p.needsUpdate = true;
  };
  // a water bottle at the back
  const bottle = new THREE.Group();

  } else {
    goalLook.set(0, -0.06, 0);
    goalPos.set(0.3 + par.x * 0.6, 0.42 + H * 0.06 - par.y * 0.3, baseZ);
  }
  const k = reduce ? 1 : 1 - Math.exp(-dt * 5);
  camPos.lerp(goalPos, k);
  camLook.lerp(goalLook, k);
  if (camPos.distanceTo(goalPos) + camLook.distanceTo(goalLook) > 0.0005) busy = true;
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  // the room dims while one compartment is in focus
  hemi.intensity += ((focused ? 0.6 : 1) * HEMI - hemi.intensity) * k;
  key.intensity += ((focused ? 0.45 : 1) * KEY - key.intensity) * k;
  if (Math.abs(key.intensity - (focused ? 0.45 : 1) * KEY) > 0.002) busy = true;

  for (const it of items) {
    const tg = it.on ? 1 : 0;
    it.glow += (tg - it.glow) * (reduce ? 1 : 1 - Math.exp(-dt * 9));
    if (Math.abs(tg - it.glow) > 0.002) busy = true;
    it.lamp.intensity = it.glow * 1.3;
    it.bulbMat.emissiveIntensity = it.glow * 3;
    it.coneMat.opacity = it.glow * 0.16;
    it.inner.scale.setScalar(it.sc * (1 + 0.02 * it.glow));
    if (!reduce && (it.on || it.running)) {
      busy = true;
      it.running = true;
      const before = it.time;
      it.time += dt / it.dur;
      if (!it.on && Math.floor(it.time) > Math.floor(before)) { it.time = 0; it.running = false; it.api.rest(); it.api.off?.(); }
      else it.api.update(it.time % 1, clock, dt, it.glow);
    } else if (!reduce) it.api.idle?.(clock, dt);
    const tag = tags.get(it.id);
    const showTag = (it.id === hovered && !focused) || it.id === focused;
    tag.classList.toggle("is-on", showTag);
    if (showTag) {
      v.set(it.g.position.x, it.g.position.y + 0.03, D / 2).project(camera);
      tag.style.transform = `translate(${(v.x * 0.5 + 0.5) * stage.clientWidth}px, ${Math.min((-v.y * 0.5 + 0.5) * stage.clientHeight, stage.clientHeight - 20)}px) translate(-50%, -60%)`;
    }
  }
  renderer.render(scene, camera);
  if (!ready) { ready = true; stage.classList.add("is-ready"); }
  if (!visible) return;
  if (busy) raf = requestAnimationFrame(frame);
  else if (!reduce) idleTimer = setTimeout(() => { idleTimer = 0; raf = requestAnimationFrame(frame); }, 45);
}

// first time on screen: the shelf wakes up, lamp by lamp, each object plays once
let introDone = reduce;
new IntersectionObserver(([e]) => {
  visible = e.isIntersecting;
  if (visible) kick();
  else { cancelAnimationFrame(raf); raf = 0; clearTimeout(idleTimer); idleTimer = 0; }
  if (visible && e.intersectionRatio > 0.5 && !introDone) {
    introDone = true;
    items.forEach((it, i) => {
      setTimeout(() => { intro.add(it.id); sync(); }, 350 + i * 250);
      setTimeout(() => { intro.delete(it.id); sync(); }, 350 + i * 250 + 900);
    });
  }
}, { threshold: [0, 0.5] }).observe(stage);
new ResizeObserver(resize).observe(stage);
resize();

// test hooks for the mockup
window.__shelf = {
  items, sync, focus: focusOn,
  hover: (id) => { hovered = id; sync(); },
  pose: (id, p) => { const it = items.find((i) => i.id === id); it.on = true; it.glow = 1; it.lamp.intensity = 1.3; it.bulbMat.emissiveIntensity = 3; it.coneMat.opacity = 0.16; it.api.update(p, p * it.dur, 0.016, 1); renderer.render(scene, camera); },
};
</script>
</body>
</html>
